<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB - Imagens Frota 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E30613; border-radius: 10px; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; background: #FFFFFF; }
        
        /* Animação suave de entrada (vinda de baixo) */
        .slide-up-active {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .unit-jump-glow { animation: glow 1.5s ease-out; }
        @keyframes glow { 0% { background-color: rgba(227, 6, 19, 0.2); } 100% { background-color: transparent; } }
        
        /* Ajuste para modo Fullscreen */
        :fullscreen body { background-color: #F8FAFC; }
        :-webkit-full-screen body { background-color: #F8FAFC; }

        /* Estilo para Lightbox (Tela Cheia) */
        #lightbox-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            cursor: zoom-out;
        }

        /* --- ESTILOS PARA O MODO COMPARAÇÃO --- */
        .comparison-active aside, 
        .comparison-active header, 
        .comparison-active footer,
        .comparison-active #current-unit-label,
        .comparison-active .nav-controls-container,
        .comparison-active #btn-open-menu {
            display: none !important;
        }

        .comparison-active #main-display { padding: 10px !important; }
        .comparison-active #current-id { font-size: 3rem !important; opacity: 0.3; margin-bottom: 0 !important; line-height: 1; }
        .comparison-active .header-info-wrapper { border-bottom: none !important; margin-bottom: 5px !important; }
        
        .comparison-active #cycles-grid {
            gap: 10px !important;
            height: calc(100vh - 60px) !important;
        }

        /* Melhoria: Controle dos Placeholders */
        .img-placeholder-icon { opacity: 0.2; transition: opacity 0.3s; }
        .show-error-icon .img-placeholder-icon { opacity: 1; color: #cbd5e1; }
        
        /* REMOVE O ÍCONE DE IMAGEM QUEBRADA DO NAVEGADOR */
        img:not([src]), img[src=""] { 
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* Menu Lateral de Opções */
        #options-menu {
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 60;
        }
        #options-menu.open { transform: translateX(0); }

        /* Classe para forçar quebra de página no PDF */
        .pdf-page-break { page-break-after: always; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 h-screen flex flex-col">

    <div id="lightbox-modal" onclick="this.style.display='none'">

    <button id="btn-open-menu" onclick="toggleMenu()" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white p-2.5 rounded-full shadow-xl hover:bg-[#E30613] transition-all scale-90 hover:scale-100">
        <i data-lucide="menu" class="w-4 h-4"></i>

                    </div>
            </div>
        </div>

        </div>
    </aside>

    <header class="bg-[#E30613] text-white h-11 flex justify-between items-center px-6 shrink-0 z-30 shadow-md">

        <div class="flex items-center gap-4">

    </header>

                        </div>

                                </div>

                            </div>
                        </div>
                    </div>

                        </div>
                        <div class="flex gap-1">

                    </div>

        </section>
    </main>

        // FUNÇÃO CARREGAMENTO IMAGENS
        function handleImgLoad(img) {
            img.classList.remove('opacity-0');
            img.classList.add('opacity-100');
        }
        // FUNÇÃO ZOOM
        function openZoom(src) {
            if(!src) return;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-modal').style.display = 'flex';
        }

        /* --- LÓGICA DO MENU DE OPÇÕES & PDF CONSOLDIDADO --- */
        function toggleMenu() {
            const menu = document.getElementById('options-menu');
            menu.classList.toggle('open');
            if(menu.classList.contains('open')) updatePDFList();
        }

        function updatePDFList() {
            const unit = document.getElementById('pdf-unit-filter').value;
            const container = document.getElementById('pdf-truck-selection');
            const list = fleetData[unit].sort((a,b) => parseInt(a.id) - parseInt(b.id));
            
            container.innerHTML = list.map(t => `
                <label class="flex items-center gap-3 p-2 hover:bg-slate-100 rounded-lg cursor-pointer transition-all">
                    <input type="checkbox" value="${t.id}" class="pdf-checkbox w-4 h-4 accent-[#E30613] rounded">
                    <span class="text-[11px] font-black text-slate-700 tracking-tighter">${t.id}</span>
                </label>
            `).join('');
        }

        function selectAllTrucks(state) {
            document.querySelectorAll('.pdf-checkbox').forEach(cb => cb.checked = state);
        }

        // CORREÇÃO: VELOCIDADE DE DOWNLOAD OTIMIZADA
        async function downloadCombinedPDF() {
            const unit = document.getElementById('pdf-unit-filter').value;
            const checkboxes = document.querySelectorAll('.pdf-checkbox:checked');
            if(checkboxes.length === 0) return alert("Selecione os veículos para o PDF.");

            const btn = document.getElementById('btn-generate-pdf');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Criando Arquivo...';
            lucide.createIcons();

            const masterContainer = document.createElement('div');
            masterContainer.style.width = "297mm"; // Fixar largura A4

            for (let idx = 0; idx < checkboxes.length; idx++) {
                const truck = fleetData[unit].find(t => t.id === checkboxes[idx].value);
                const page = document.createElement('div');
                if (idx < checkboxes.length - 1) page.className = 'pdf-page-break';
                page.style.cssText = 'padding: 10mm; background: white; width: 277mm; min-height: 190mm; position: relative; font-family: sans-serif; box-sizing: border-box;';
                
                page.innerHTML = `
                    <div style="border-bottom: 4px solid #E30613; padding-bottom: 4mm; margin-bottom: 6mm; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h1 style="margin: 0; font-size: 22pt; font-weight: 900; color: #E30613;">COSTA BRASIL</h1>
                            <p style="margin: 0; font-size: 8pt; font-weight: bold; color: #64748b; letter-spacing: 1px;">RELATÓRIO TÉCNICO DE FROTA 2025</p>
                        </div>
                        <div style="text-align: right;">
                            <span style="font-size: 28pt; font-weight: 900; line-height: 1; color: #0f172a;">ID: ${truck.id}</span>
                            <div style="font-size: 10pt; font-weight: 800; color: #64748b; text-transform: uppercase;">UNIDADE: ${unit}</div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 4mm; justify-content: space-between; align-items: stretch;">
                        ${[0, 1, 2].map(i => {
                            const cycleFolder = FOLDER_MAP.cycles[i];
                            const unitFolder = FOLDER_MAP.units[unit];
                            const isActive = truck.active[i];
                            return `
                            <div style="flex: 1; border: 1.5px solid ${isActive ? '#e2e8f0' : '#f1f5f9'}; border-radius: 10px; padding: 3mm; background: ${isActive ? '#ffffff' : '#fcfcfc'}; opacity: ${isActive ? '1' : '0.2'};">
                                <div style="font-size: 10pt; font-weight: 900; color: #E30613; border-bottom: 1px solid #f1f5f9; padding-bottom: 1.5mm; margin-bottom: 3mm; display: flex; justify-content: space-between; align-items: center;">
                                    <span>${cycleInfo[i].label}</span>
                                    <span style="font-size: 7pt; color: #94a3b8; font-weight: bold;">${truck.months[i] || 'PENDENTE'}</span>
                                </div>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2.5mm;">
                                    ${[1, 2, 3, 4].map(s => `
                                        <div style="aspect-ratio: 4/3; background: #f8fafc; border-radius: 6px; overflow: hidden; border: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: center;">
                                            <img src="${cycleFolder}/${unitFolder}/${truck.id}/slot${s}.jpg" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none'">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                `;
                masterContainer.appendChild(page);
            }

            const opt = {
                margin: 0,
                filename: `Frota_2025_${unit}.pdf`,
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: 1.5, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape', compress: true }
            };

            await html2pdf().set(opt).from(masterContainer).save();

            btn.innerHTML = originalContent;
            lucide.createIcons();
            toggleMenu();
        }

        /* --- LÓGICA DE COMPARAÇÃO --- */
        let isComparisonMode = false;

        function toggleComparison() {
            isComparisonMode = !isComparisonMode;
            const btn = document.getElementById('btn-comparison');
            if (isComparisonMode) {
                document.body.classList.add('comparison-active');
                btn.innerHTML = '<i data-lucide="x" class="w-3.5 h-3.5"></i> Sair da Comparação';
            } else {
                document.body.classList.remove('comparison-active');
                btn.innerHTML = '<i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> Comparar Ciclos';
            }
            lucide.createIcons();
        }

        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('btn-comparison');
            if (document.fullscreenElement) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
                if (isComparisonMode) toggleComparison(); 
            }
        });

        // --- LÓGICA DE RENDERIZAÇÃO ---
        function render(isUnitJump = false) {
            const list = fleetData[activeUnit]
                .filter(t => t.id.includes(searchTerm))
                .sort((a, b) => parseInt(a.id) - parseInt(b.id));
            
            const truck = list[currentIndex] || list[0] || { id: "---", months: [null, null, null], active: [false, false, false] };
            
            const animatedContent = document.getElementById('animated-content');
            animatedContent.classList.remove('slide-up-active');
            void animatedContent.offsetWidth; 
            animatedContent.classList.add('slide-up-active');

            const display = document.getElementById('main-display');
            if (isUnitJump) {
                display.classList.add('unit-jump-glow');
                setTimeout(() => display.classList.remove('unit-jump-glow'), 1500);
            }

            const unitSelector = document.getElementById('unit-selector');
            unitSelector.innerHTML = Object.keys(fleetData).map(name => `
                <button onclick="changeUnit('${name}')" class="px-3 py-1.5 rounded-md transition-all ${activeUnit === name ? 'bg-white text-[#E30613] shadow-md scale-105' : 'text-white/60 hover:text-white'}">
                    ${name}
                </button>
            `).join('');

            document.getElementById('total-counter').innerText = `${list.length} veículos`;
            const truckList = document.getElementById('truck-list');
            truckList.innerHTML = list.map((t, i) => `
                <button onclick="setStep(${i})" class="w-full group flex flex-col items-center p-2.5 rounded-xl transition-all duration-200 ${truck.id === t.id ? 'bg-[#E30613] text-white shadow-lg scale-105' : 'hover:bg-white text-slate-400'}">
                    <span class="text-[11px] font-black">${t.id}</span>
                </button>
            `).join('');

            const activeTruckButton = truckList.querySelector('.bg-\\[\\#E30613\\]');
            if (activeTruckButton) {
                activeTruckButton.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            document.getElementById('current-id').innerText = truck.id;
            document.getElementById('current-unit-label').innerText = activeUnit;
            document.getElementById('page-indicator').innerText = `${list.length > 0 ? currentIndex + 1 : 0} de ${list.length}`;
            
            const notesContainer = document.getElementById('notes-container');
            notesContainer.innerHTML = '';
            if(truck.transfer) notesContainer.innerHTML += `<div class="bg-red-600 text-white px-4 py-0.5 rounded shadow-sm text-[10px] font-black uppercase flex items-center gap-1"><i data-lucide="arrow-right-left" class="w-2.5 h-2.5 text-white"></i> ${truck.transfer}</div>`;
            if(truck.notes) notesContainer.innerHTML += `<div class="bg-slate-900 text-white px-4 py-0.5 rounded text-[10px] font-black uppercase flex items-center gap-1 shadow-sm"><i data-lucide="wrench" class="w-2.5 h-2.5 text-[#E30613]"></i> ${truck.notes}</div>`;

            const grid = document.getElementById('cycles-grid');
            grid.innerHTML = [0, 1, 2].map(i => {
                const isActive = truck.active[i];
                const month = truck.months[i];
                const cycleFolder = FOLDER_MAP.cycles[i];
                const unitFolder = FOLDER_MAP.units[activeUnit];

                return `
                    <div class="flex flex-col rounded-3xl border-2 transition-all duration-500 overflow-hidden ${isActive ? 'bg-white border-slate-100 shadow-xl' : 'bg-slate-50 border-dashed border-slate-200 opacity-20 grayscale'}">
                        <div class="px-4 py-2 border-b flex flex-col gap-0.5 shrink-0 ${isActive ? 'bg-[#E30613]/5 border-slate-100' : 'border-transparent'}">
                            <div class="flex justify-between items-center">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <div class="w-1.5 h-1.5 rounded-full ${isActive ? 'bg-[#E30613]' : 'bg-slate-300'}"></div>
                                        <span class="text-[9px] font-black text-slate-800 uppercase tracking-widest">${cycleInfo[i].label}</span>
                                    </div>
                                    <span class="text-[7px] font-bold text-slate-400 uppercase tracking-tight italic leading-none">${cycleInfo[i].range}</span>
                                </div>
                                ${isActive ? '<i data-lucide="check-circle-2" class="w-3 h-3 text-green-500"></i>' : ''}
                            </div>
                            ${isActive && month ? `
                                <div class="mt-0.5 bg-slate-900 text-white text-[8px] font-black py-0.5 px-2 rounded shadow flex items-center justify-center gap-1.5 uppercase tracking-widest leading-none">
                                    <i data-lucide="calendar" class="w-2.5 h-2.5 text-[#E30613]"></i> ${month}
                                </div>
                            ` : (isActive ? '<div class="mt-0.5 bg-slate-100 text-slate-400 text-[7px] font-black py-0.5 px-2 rounded text-center italic tracking-widest leading-none">Aguardando Validação</div>' : '')}
                        </div>
                        
                        <div class="flex-1 p-2 grid grid-cols-2 grid-rows-2 gap-2 bg-slate-50/20 overflow-hidden min-h-0">
                            ${[1, 2, 3, 4].map(s => {
                                const path = `${cycleFolder}/${unitFolder}/${truck.id}/slot${s}.jpg`;
                                return `
                                    <div class="image-slot min-h-0 h-full w-full bg-slate-100/80 rounded-2xl border border-slate-100 relative group overflow-hidden cursor-pointer shadow-sm flex items-center justify-center">
                                        <img src="${path}" 
                                             onload="handleImgLoad(this)"
                                             onerror="handleImgError(this)" 
                                             onclick="openZoom('${path}')"
                                             class="opacity-0 max-w-full max-h-full object-contain z-10 transition-all duration-500 group-hover:scale-105">
                                        <i data-lucide="image" class="img-placeholder-icon absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 text-slate-200 z-0"></i>
                                        <i data-lucide="maximize-2" class="absolute bottom-2 right-2 w-3 h-3 text-[#E30613] opacity-0 group-hover:opacity-100 transition-opacity z-20"></i>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            const dots = document.getElementById('pagination-dots');
            dots.innerHTML = list.map((_, i) => `<div class="h-1 rounded-full transition-all duration-300 ${currentIndex === i ? 'w-4 bg-[#E30613]' : 'w-1 bg-slate-200'}"></div>`).join('');

            lucide.createIcons();
        }

        // --- INTERAÇÕES ---
        function changeUnit(unit) { activeUnit = unit; currentIndex = 0; render(); }
        function setStep(i) { currentIndex = i; render(); }
        
        document.getElementById('prev-btn').onclick = () => { if(currentIndex > 0) { currentIndex--; render(); } };
        document.getElementById('next-btn').onclick = () => { 
            const list = fleetData[activeUnit].filter(t => t.id.includes(searchTerm));
            if(currentIndex < list.length - 1) { currentIndex++; render(); } 
        };

        // CORREÇÃO: PESQUISA INTELIGENTE (Trava o ID atual)
        document.getElementById('search-input').oninput = (e) => {
            const val = e.target.value.trim();
            // Pega o ID que está sendo exibido agora na tela
            const currentSelectedId = document.getElementById('current-id').innerText;

            searchTerm = val;

            if (val.length >= 2) {
                for (const unit in fleetData) {
                    const foundIndex = fleetData[unit].findIndex(t => t.id === val);
                    if (foundIndex !== -1) {
                        activeUnit = unit;
                        currentIndex = foundIndex;
                        render();
                        return;
                    }
                }
            } 
            
            // Quando apaga a barra de pesquisa:
            // Pegamos a lista total (ou filtrada) e descobrimos onde o carro que já estava na tela está posicionado.
            const fullListSorted = fleetData[activeUnit]
                .filter(t => t.id.includes(searchTerm))
                .sort((a, b) => parseInt(a.id) - parseInt(b.id));

            const newIndex = fullListSorted.findIndex(t => t.id === currentSelectedId);
            
            if (newIndex !== -1) {
                currentIndex = newIndex;
            } else {
                currentIndex = 0;
            }

            render();
        };

        window.addEventListener('keydown', (e) => {
            const searchInput = document.getElementById('search-input');
            if (document.activeElement === searchInput) return;
            
            if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
            else if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
            else if (e.key === 'Escape') document.getElementById('lightbox-modal').style.display = 'none';
            
            if ((e.key === 'c' || e.key === 'C') && document.fullscreenElement) {
                toggleComparison();
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        window.onload = render;
    </script>
